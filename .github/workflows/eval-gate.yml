# Equivalent Jenkins/GitLab stage: run `make ci`. A PR cannot merge if sealed correctness drops >2 pts or citation precision drops at all.
name: eval-gate
on: [pull_request]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt && make ci
